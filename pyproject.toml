[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-evaluation"
version = "0.1.0"
description = "Single factor evaluation built on quant-backtest-system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=16,<24", "matplotlib>=3.9,<4", "bottleneck>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["factoreval*"]
